[package]
name = "remote-desktop"
version = "0.9.0"
edition = "2024"
license = "GPL-2.0-or-later"

[dependencies]
bytes = "1"
pic-scale = { version = "0.7.12", default-features = false, features = ["neon", "sse", "avx"] }
quinn-proto = { version = "0.11", default-features = false, features = ["rustls-ring"] }
rcgen = "0.14"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
sha1_smol = "1"
time = "0.3"
unsafe-libopus = "0.2"
yuv = "0.8"

# What the host needs on Unix systems (see src/platform/unix),
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# and on Linux alone (see src/platform/linux).
[target.'cfg(target_os = "linux")'.dependencies]
pulseaudio = "0.3"
rustbus = "0.19"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "0.14", default-features = false, features = ["damage", "randr", "shm", "xfixes", "xtest"] }

# and on Windows (see src/platform/windows).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
cc = "1"

[profile.release]
strip = true
