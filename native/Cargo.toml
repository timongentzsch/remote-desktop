[package]
name = "remote-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
serde_json = "1"
sha1_smol = "1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
yuv = "0.8"

[build-dependencies]
cc = "1"

[profile.release]
strip = true
