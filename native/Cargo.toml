[package]
name = "remote-desktop"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"

[dependencies]
libc = "0.2"
pulseaudio = "0.3"
rcgen = "0.14"
rustbus = "0.19"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
sha1_smol = "1"
time = "0.3"
unsafe-libopus = "0.2"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "0.14", default-features = false, features = ["damage", "shm", "xfixes"] }
yuv = "0.8"

[build-dependencies]
cc = "1"

[profile.release]
strip = true
