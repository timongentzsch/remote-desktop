<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Remote Desktop</title>
<style>
  /* White on black, square, one typeface: JetBrains Mono, which the host serves along with the page. */
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; font-display: swap; src: url(JetBrainsMono-Regular.woff2) format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 500; font-display: swap; src: url(JetBrainsMono-Medium.woff2) format("woff2"); }
  :root {
    --ground: #000; --text: #fff; --muted: #a6a6a6; --dim: #8c8c8c; --line: #333;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace;
    --control: 32px; --field: 48px; --inset: 12px; --edge: 16px;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ground); color: var(--text); font: 13px/1.4 var(--mono); }
  button, input, select { font: inherit; color: inherit; border-radius: 0; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  /* What has the focus is marked inside its own edges: in the ground's colour where it is filled white, and
     around it only where it is too small to hold the mark. */
  :focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }
  .primary:focus-visible, .slow .pill:focus-visible { outline-color: var(--ground); outline-offset: -4px; }
  .option input:focus-visible, .steps input:focus-visible { outline-offset: 2px; }

  /* Connect screen */
  .connect { position: fixed; inset: 0; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
  .card { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 32px; }
  .host { display: flex; align-items: center; gap: var(--edge); }
  .host h1 { margin: 0; font-size: 16px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
  .field { display: grid; grid-template-columns: 1fr auto; row-gap: 8px; }
  .field label { grid-column: 1 / -1; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .field input { min-width: 0; height: var(--field); box-sizing: border-box; padding: 0 14px; border: 1px solid var(--text); border-right: 0; background: var(--ground); font-size: 16px; letter-spacing: .2em; }
  .primary { height: var(--field); padding: 0 22px; border: 1px solid var(--text); background: var(--text); color: var(--ground); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
  .open .field { grid-template-columns: 1fr; }
  .open .field label, .open .field input { display: none; }
  .option { display: flex; align-items: flex-start; gap: 14px; cursor: pointer; }
  .option input { appearance: none; flex: none; width: 18px; height: 18px; margin: 0; border: 1px solid var(--text); background: var(--ground); }
  .option input:checked { background: var(--text); box-shadow: inset 0 0 0 4px var(--ground); }
  .option small { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .summary { margin: 0; min-height: 1.4em; font-size: 12px; color: var(--muted); text-align: center; }
  .problem { color: var(--text); }

  /* Session */
  canvas { display: none; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .overlay { display: none; position: fixed; left: 0; right: 0; bottom: var(--edge); box-sizing: border-box; padding: 0 var(--edge); flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  .overlay > * { pointer-events: auto; }
  .connected .connect { display: none; }
  .connected canvas { display: block; }
  .connected .overlay { display: flex; }
  canvas { cursor: var(--pointer, default); }
  .remote-cursor canvas { cursor: none; }

  .pill { height: var(--control); padding: 0 var(--inset); display: flex; align-items: center; gap: 10px; border: 1px solid var(--text); background: var(--ground); }
  .dot { width: 8px; height: 8px; background: currentColor; }
  .slow .pill { background: var(--text); color: var(--ground); font-weight: 500; }
  /* While a session that ended is being taken up again, the pill stays in sight, hollow and dashed. */
  .waiting .pill { translate: none; border-style: dashed; }
  .waiting .dot { box-sizing: border-box; border: 1px solid currentColor; background: none; }
  .pill svg { transition: rotate .15s; }
  /* The pill waits below the bottom edge and slides in when asked for; it lingers a moment before leaving. */
  .pill { translate: 0 calc(100% + 2 * var(--edge)); transition: translate .25s ease .4s; }
  .pill-shown .pill, .panel-open .pill, .pill:focus-visible { translate: none; transition-delay: 0s; }
  @media (hover: none) { .pill { translate: none; } }
  @media (prefers-reduced-motion: reduce) { .pill { transition-duration: 0s; } }
  .panel-open .pill svg { rotate: 180deg; }

  /* The numbers, pinned to a corner of the picture where that is chosen. */
  .readout { display: none; position: fixed; padding: 6px 10px; gap: 14px; background: var(--ground); font-size: 12px; pointer-events: none; }
  .connected[data-pin]:not([data-pin="off"]) .readout { display: flex; }
  [data-pin^="top"] .readout { top: var(--inset); }
  [data-pin^="bottom"] .readout { bottom: var(--inset); }
  [data-pin$="left"] .readout { left: var(--inset); }
  [data-pin$="right"] .readout { right: var(--inset); }

  .panel { width: 100%; max-width: 400px; box-sizing: border-box; display: flex; flex-direction: column; border: 1px solid var(--text); background: var(--ground); }
  .panel > * { border-bottom: 1px solid var(--line); }
  .notice { display: none; margin: 0; padding: 8px var(--inset); background: var(--text); color: var(--ground); }
  .slow .notice { display: block; }
  .stats, .delay { padding: 10px var(--inset) 8px; display: flex; flex-direction: column; gap: 2px; }
  .now { display: flex; gap: 18px; font-size: 16px; font-weight: 500; white-space: nowrap; }
  .stats small, .says { font-size: 12px; color: var(--muted); }
  .delay { gap: 6px; }
  .bar { display: flex; gap: 2px; height: 6px; }
  .bar i { flex: var(--weight, 1) 1 0; min-width: 2px; background: var(--text); transition: flex-grow .8s ease; }
  .bar i:nth-child(even) { background: var(--dim); }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
  .legend { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
  .legend span:nth-child(even) { color: var(--muted); }
  .legend span { white-space: nowrap; }
  .priority { padding: 0 var(--inset) 8px; display: flex; flex-direction: column; }
  .steps { display: flex; align-items: center; }
  .steps span { flex: 1 1 0; }
  .steps span:last-child { text-align: right; }
  .steps label { width: 28px; height: var(--control); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .steps input { appearance: none; width: 12px; height: 12px; margin: 0; border: 1px solid var(--text); background: none; cursor: pointer; }
  .steps input:checked { background: var(--text); }
  /* The lines between the settings are the grid's own ground showing through its gaps. */
  .settings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border-bottom-color: var(--text); }
  .setting { min-width: 0; height: var(--control); padding: 0 var(--inset); display: flex; align-items: center; gap: 8px; background: var(--ground); color: var(--muted); white-space: nowrap; }
  .setting.wide { grid-column: 1 / -1; }
  .setting select { appearance: none; flex: 1 1 0; min-width: 0; height: 100%; margin-right: calc(-1 * var(--inset)); padding: 0 var(--inset) 0 0; border: 0; background: var(--ground); color: var(--text); text-align: right; text-align-last: right; text-overflow: ellipsis; cursor: pointer; }
  /* A setting is marked as a whole, its name included, while its select has the focus or its list is open. */
  .setting:has(select:focus-visible), .setting:has(select:open) { outline: 2px solid var(--text); outline-offset: -2px; }
  .setting select:focus-visible { outline: none; }
  /* Where the browser lets a select's list be drawn by the page (Chrome), it looks like the panel. Elsewhere it
     is the system's menu. */
  @supports (appearance: base-select) {
    .setting select, .setting select::picker(select) { appearance: base-select; }
    .setting select { justify-content: flex-end; align-items: center; }
    .setting select::picker-icon { display: none; }
    .setting select::picker(select) { margin: 2px 0; padding: 0; border: 1px solid var(--text); border-radius: 0; background: var(--ground); }
    .setting option { min-height: var(--control); box-sizing: border-box; padding: 0 var(--inset); display: flex; align-items: center; background: var(--ground); color: var(--text); white-space: nowrap; }
    .setting option::checkmark { display: none; }
    .setting option:hover, .setting option:focus-visible { background: var(--line); outline: none; }
    .setting option:checked { background: var(--text); color: var(--ground); }
  }
  .actions { display: flex; border-bottom: 0; }
  .actions button { flex: 1 1 0; height: var(--control); border: 0; background: var(--ground); }
  .actions button + button { border-left: 1px solid var(--text); }
</style>

<canvas></canvas>
<div class="readout" aria-hidden="true"><span id="pin-fps"></span><span id="pin-delay"></span><span id="pin-bitrate"></span></div>

<main class="connect">
  <form class="card" id="login">
    <div class="host">
      <svg class="mark" aria-hidden="true" width="32" height="32" viewBox="0 0 32 32"><rect x="1" y="1" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2"/><rect x="10" y="10" width="12" height="12" fill="currentColor"/></svg>
      <h1 id="host">Remote Desktop</h1>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
      <button class="primary">Connect</button>
    </div>
    <label class="option">
      <input type="checkbox" name="fullscreen" checked>
      <span>Open in full screen <small>Sends system shortcuts to the remote computer. Hold Esc to leave.</small></span>
    </label>
  </form>
  <p class="summary" id="summary"></p>
</main>

<div class="overlay">
  <form class="panel" id="settings" hidden>
    <p class="notice" id="notice"></p>
    <div class="stats">
      <div class="now"><output id="now-fps">–</output><output id="now-delay">–</output><output id="now-bitrate">–</output></div>
      <small id="now-picture">–</small>
    </div>
    <div class="delay" title="Where the measured delay goes. Capturing and displaying are not included.">
      <div class="bar" role="img" aria-label="Delay split into encoding, sending, network and decoding">
        <i class="encode"></i><i class="send"></i><i class="network"></i><i class="decode"></i>
      </div>
      <div class="legend">
        <span>Encode <output class="encode">–</output></span>
        <span>Send <output class="send">–</output></span>
        <span>Network <output class="network">–</output></span>
        <span>Decode <output class="decode">–</output> ms</span>
      </div>
    </div>
    <div class="priority">
      <div class="steps" role="radiogroup" aria-label="What gives way when the connection is not enough">
        <span>Response</span>
        <label><input type="radio" name="patience" value="25" aria-label="Response first"></label>
        <label><input type="radio" name="patience" value="50" aria-label="Response"></label>
        <label><input type="radio" name="patience" value="100" aria-label="Balanced" checked></label>
        <label><input type="radio" name="patience" value="200" aria-label="Quality"></label>
        <label><input type="radio" name="patience" value="400" aria-label="Quality first"></label>
        <span>Quality</span>
      </div>
      <span class="says" id="patience-says"></span>
    </div>
    <div class="settings">
      <label class="setting">Bitrate
        <select name="bitrate">
          <option value="">Auto</option>
          <option value="2000">2 Mbit/s</option>
          <option value="5000">5 Mbit/s</option>
          <option value="10000">10 Mbit/s</option>
          <option value="20000">20 Mbit/s</option>
          <option value="40000">40 Mbit/s</option>
        </select>
      </label>
      <label class="setting">Frame rate
        <select name="fps">
          <option value="60">60 fps</option>
          <option value="30">30 fps</option>
          <option value="15">15 fps</option>
        </select>
      </label>
      <label class="setting">Size
        <select name="size" title="Host shows the host's screen as it is. Client gives the remote desktop a screen of this window's size and switches the host's own screens off while connected, where the desktop allows (Hyprland). 1080p, 720p and 360p shrink the host's screen to that height, for less data.">
          <option value="host">Host</option>
          <option value="client">Client</option>
          <option value="1080">1080p</option>
          <option value="720">720p</option>
          <option value="360">360p</option>
        </select>
      </label>
      <label class="setting">Colour detail
        <select name="chroma" title="Full keeps coloured text and thin lines crisp, for more work on both ends and more data. Reduced halves colour detail. Auto keeps it full where that fits.">
          <option value="auto">Auto</option>
          <option value="444">Full</option>
          <option value="420">Reduced</option>
        </select>
      </label>
      <label class="setting">Pointer
        <select name="cursor" title="Local: drawn here, instant, in the remote pointer's shape where the desktop tells it. Remote: always the true shape, but part of the video.">
          <option value="no">Local</option>
          <option value="yes">Remote</option>
        </select>
      </label>
      <label class="setting">Sound
        <select name="sound">
          <option value="on">On</option>
          <option value="off">Off</option>
        </select>
      </label>
      <label class="setting wide">Numbers
        <select name="pin" title="Keeps frame rate, delay and bitrate in a corner of the picture.">
          <option value="off">Hidden</option>
          <option value="top-left">Top left</option>
          <option value="top-right">Top right</option>
          <option value="bottom-left">Bottom left</option>
          <option value="bottom-right">Bottom right</option>
        </select>
      </label>
      <label class="setting wide" hidden>Screen
        <select name="screen"></select>
      </label>
    </div>
    <div class="actions">
      <button type="button" id="fullscreen">Full screen</button>
      <button type="button" id="leave">Disconnect</button>
    </div>
  </form>
  <button type="button" class="pill" id="pill">
    <span class="dot" aria-hidden="true"></span>
    <span id="pill-text">Connecting</span>
    <svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"><path d="M2 8l4-4 4 4"/></svg>
  </button>
</div>

<script>
const $ = id => document.getElementById(id);
const canvas = document.querySelector('canvas'), login = $('login'), settings = $('settings');
const SAVED = ['bitrate', 'patience', 'fps', 'size', 'chroma', 'cursor', 'sound', 'pin', 'screen'];

// What the host sends, as native/src/ws.rs and stream/flv.rs say: a binary message's first byte tells its kind,
// and video goes in FLV, a header that begins with "F" and then tags of [type, size:3, time:3+1, stream:3,
// data, size again:4]. Video's tag type is its kind.
const PADDING = 0, POINTER = 7, SOUND = 8, VIDEO = 9;
const FLV_SIGNATURE = 0x46, FLV_HEADER = 13, TAG_HEAD = 11, TAG_TAIL = 4;
// Sound as audio.rs encodes it, and the range pointer positions are told in (input.rs's ABS_RANGE).
const SOUND_RATE = 48000, SOUND_CHANNELS = 2;
const POINTER_RANGE = 65535;
// The longest message the host reads (ws.rs), less room for the message's own wrapping.
const LONGEST_MESSAGE = 60000;

let socket, stop;  // the current session's connection, and what ends it
let path = null;    // its session to the host's UDP side, where there is one
let moves = 0;      // how many moves of the pointer were sent
const connected = () => document.body.classList.contains('connected');
const send = (...message) => socket?.readyState === WebSocket.OPEN && socket.send(JSON.stringify(message));

// ---- Video ----

const context = canvas.getContext('2d', { alpha: false, desynchronized: true });  // skip compositor queueing where supported

// Decodes the stream and draws it. `failed` is called if the decoder gives up.
function videoPlayer(failed) {
  let pending = new Uint8Array(0), frames = 0, decodeTime = 0;
  const submitted = [];  // when each frame still inside the decoder was handed to it
  const decoder = new VideoDecoder({
    output(frame) {
      decodeTime += performance.now() - submitted.shift();
      frames++;
      if (canvas.width !== frame.displayWidth || canvas.height !== frame.displayHeight) {
        canvas.width = frame.displayWidth;
        canvas.height = frame.displayHeight;
        showPointer();  // its size follows the picture's
      }
      context.drawImage(frame, 0, 0);
      frame.close();
    },
    error: failed,
  });
  return {
    // Takes the next piece of the stream, however the network cut it up. The stream is FLV: a 13-byte header
    // that begins with "F", then tags of [type, size:3, time:3+1, stream:3, data, back-pointer:4]. Video tag
    // data is [frame type | codec, packet type, composition time:3, payload].
    feed(chunk) {
      const stream = new Uint8Array(pending.length + chunk.byteLength);
      stream.set(pending);
      stream.set(new Uint8Array(chunk), pending.length);
      let at = stream[0] === FLV_SIGNATURE ? FLV_HEADER : 0;
      for (;;) {
        const size = stream[at + 1] << 16 | stream[at + 2] << 8 | stream[at + 3];
        if (stream.length < at + TAG_HEAD + size + TAG_TAIL) break;  // also while the tag head is incomplete
        const data = stream.subarray(at + TAG_HEAD, at + TAG_HEAD + size);
        if (stream[at] === VIDEO && data[1] === 0) {         // H.264 decoder configuration (avcC)
          const profile = [...data.subarray(6, 9)].map(byte => byte.toString(16).padStart(2, '0')).join('');
          colourDetail = data[6] === 244 ? 'full' : 'reduced';  // High 4:4:4 Predictive keeps it full
          decoder.configure({ codec: 'avc1.' + profile, description: data.slice(5), optimizeForLatency: true });
        } else if (stream[at] === VIDEO) {
          submitted.push(performance.now());
          decoder.decode(new EncodedVideoChunk({
            type: data[0] >> 4 === 1 ? 'key' : 'delta',
            timestamp: (stream[at + 4] << 16 | stream[at + 5] << 8 | stream[at + 6]) * 1000,
            data: data.subarray(5),
          }));
        }
        at += 11 + size + 4;
      }
      pending = stream.slice(at);
    },
    // How many frames were drawn since the last call, and how long decoding one took on average, in ms.
    measure() {
      const measured = { frames, decode: decodeTime / (frames || 1) };
      frames = decodeTime = 0;
      return measured;
    },
    close: () => decoder.state !== 'closed' && decoder.close(),
  };
}

// ---- Video over UDP ----

// Where the host has a UDP side, video comes as datagrams, which do not wait behind a lost one as everything
// on the WebSocket does. The host cuts each piece of the stream into shards of equal length, in blocks of k,
// and adds m spares to each block (see fec.rs in the host); any k of a block's k + m datagrams give it back.
// A datagram is: 9, the piece's number (4 bytes), its length (3), how many of the piece's shards come before
// this block (2), k, m, which of the block's k + m this is, then the shard.
const HEAD = 13, NOTHING = 0xFFFFFFFF;
// Datagrams to the host, as quic.rs reads them: the token, a kind, and 8 bytes for what that kind tells.
const TOKEN_LENGTH = 16, STATUS_KIND = 0, MOVE_KIND = 1, DATAGRAM_LENGTH = TOKEN_LENGTH + 1 + 8;

// The spares are sums of the shards, each times a factor, calculated byte by byte in the field of 256 elements,
// where adding is exclusive or and multiplying goes by logarithms.
const POWER = new Uint8Array(510), LOGARITHM = new Uint8Array(256);
for (let exponent = 0, value = 1; exponent < 510; exponent++) {
  POWER[exponent] = value;
  if (exponent < 255) LOGARITHM[value] = exponent;
  value <<= 1;
  if (value > 255) value ^= 0x11D;
}
const times = (a, b) => a && b ? POWER[LOGARITHM[a] + LOGARITHM[b]] : 0;
const inverse = a => POWER[255 - LOGARITHM[a]];
const factor = (spare, shard) => inverse(shard ^ (255 - spare));
function add(to, from, by) {  // adds `by` times `from` to `to`
  const shift = LOGARITHM[by];
  if (by) for (let i = 0; i < to.length; i++) if (from[i]) to[i] ^= POWER[LOGARITHM[from[i]] + shift];
}

// Fills in the shards missing among a block's first k, given at least k of all its datagrams. Each spare, less
// what the shards that are there add to it, is a sum of the missing ones: as many equations as unknowns, solved
// by elimination.
function rebuild(shards, k) {
  const missing = [], spares = [];
  for (let index = 0; index < k; index++) if (!shards[index]) missing.push(index);
  for (let index = k; index < shards.length && spares.length < missing.length; index++) if (shards[index]) spares.push(index - k);
  const sums = spares.map(spare => {
    const sum = shards[k + spare].slice();
    for (let index = 0; index < k; index++) if (shards[index]) add(sum, shards[index], factor(spare, index));
    return sum;
  });
  const factors = spares.map(spare => Uint8Array.from(missing, index => factor(spare, index)));
  for (let column = 0; column < missing.length; column++) {
    const pivot = factors.findIndex((row, at) => at >= column && row[column]);
    [factors[column], factors[pivot]] = [factors[pivot], factors[column]];
    [sums[column], sums[pivot]] = [sums[pivot], sums[column]];
    const scale = inverse(factors[column][column]);
    factors[column] = factors[column].map(value => times(value, scale));
    sums[column] = sums[column].map(value => times(value, scale));
    for (let row = 0; row < missing.length; row++) {
      const by = factors[row][column];
      if (row === column || !by) continue;
      add(factors[row], factors[column], by);
      add(sums[row], sums[column], by);
    }
  }
  missing.forEach((index, at) => shards[index] = sums[at]);
}

// Whether a piece of the stream says how to decode what follows, which is where a decoder can begin.
const begins = piece => piece[0] === VIDEO && piece[12] === 0;

// Puts pieces back together from their datagrams and hands them to `use` in order. When a piece cannot be had,
// those after it are of no use either: `ask` is called for the host to be told, which then sends a frame to
// begin with, and the stream goes on from the next piece that says how to decode. A piece counts as lost when
// one after it is under way and it is still not whole GRACE ms later.
const GRACE = 8, MOST_OPEN = 512;
function pieceJoiner(use, ask) {
  const open = new Map();  // by number: the pieces under way and those whole but not yet due
  let due = null;          // the number of the piece to hand on next; null until the stream has begun
  let from = 0;            // pieces before this one are from a way the video has left since
  let used = NOTHING, missing = NOTHING, timer = 0;
  function lose() {
    [timer, missing] = [0, due];
    ask();
    advance();
  }
  function advance() {
    if (due === null || missing !== NOTHING) {
      const whole = [...open].filter(([, piece]) => piece.bytes);
      const start = whole.filter(([, piece]) => begins(piece.bytes)).map(([number]) => number).sort((a, b) => a - b)[0];
      if (start === undefined) return whole.forEach(([number]) => open.delete(number));
      [due, missing] = [start, NOTHING];
    }
    for (let piece; (piece = open.get(due))?.bytes; due++) {
      open.delete(due);
      used = due;
      use(piece.bytes);
    }
    for (const number of open.keys()) if (number < due) open.delete(number);
    clearTimeout(timer);
    timer = [...open.keys()].some(number => number > due) ? setTimeout(lose, GRACE) : 0;
  }
  return {
    take(datagram) {
      const view = new DataView(datagram.buffer, datagram.byteOffset);
      const number = view.getUint32(1), length = view.getUint32(4) & 0xFFFFFF, base = view.getUint16(8);
      const k = datagram[10], index = datagram[12], size = datagram.length - HEAD;
      if (number < from || number < (missing !== NOTHING ? missing : due ?? 0)) return;
      if (open.size > MOST_OPEN) open.clear();
      let piece = open.get(number);
      if (!piece) open.set(number, piece = { blocks: new Map(), shards: 0, data: new Uint8Array(Math.max(1, Math.ceil(length / size)) * size) });
      if (due !== null && missing === NOTHING && number > due && !timer) timer = setTimeout(lose, GRACE);
      if (piece.bytes) return;
      let block = piece.blocks.get(base);
      if (!block) piece.blocks.set(base, block = { shards: [], have: 0 });
      if (!block.shards || block.shards[index]) return;
      block.shards[index] = datagram.subarray(HEAD);
      if (++block.have < k) return;
      rebuild(block.shards, k);
      for (let shard = 0; shard < k; shard++) piece.data.set(block.shards[shard], (base + shard) * size);
      block.shards = null;  // whole
      piece.shards += k;
      if (piece.shards * size < length) return;
      piece.bytes = piece.data.subarray(0, length);
      advance();
    },
    // The video has gone another way and comes back, if it does, with piece `number`.
    restart(number) {
      clearTimeout(timer);
      open.clear();
      [from, due, missing, timer] = [number, null, NOTHING, 0];
    },
    // The last piece handed on and the first that is missing, as the host wants to know them.
    status: () => [used, missing],
    close: () => clearTimeout(timer),
  };
}

// The session to the host's UDP side: a WebTransport session, which the host's certificate is good for by its
// fingerprint alone. Datagrams that arrive go to `take`. Where the browser or the network will not have it,
// nothing arrives and video stays on the WebSocket; AGAIN ms after it failed or ended, `failed` is called, for
// the host to be asked how to reach it now: its certificate is renewed every day.
const AGAIN = 3000;
function datagramPath(port, fingerprint, token, take, failed) {
  if (!window.WebTransport) return null;
  const bytes = hex => Uint8Array.from(hex.match(/../g), pair => parseInt(pair, 16));
  let transport, writer, closed = false, timer = 0;
  (async () => {
    try {
      const pinned = { serverCertificateHashes: [{ algorithm: 'sha-256', value: bytes(fingerprint) }] };
      transport = new WebTransport(`https://${location.hostname}:${port}/`, pinned);
      await transport.ready;
      transport.datagrams.incomingHighWaterMark = 4096;  // a frame's datagrams arrive together, and none is to be dropped
      writer = transport.datagrams.writable.getWriter();
      for (const reader = transport.datagrams.readable.getReader(); ;) {
        const { value, done } = await reader.read();
        if (done) break;
        take(value);
      }
    } catch {}
    writer = null;
    if (!closed) timer = setTimeout(failed, AGAIN);
  })();
  // What goes to the host (quic.rs) begins with the token, which says who this is, and a byte for what follows.
  const datagram = kind => {
    const message = new Uint8Array(DATAGRAM_LENGTH);
    message.set(bytes(token));
    message[TOKEN_LENGTH] = kind;
    return [message, new DataView(message.buffer)];
  };
  return {
    // How the video fares: the last piece used and the first missing.
    say(used, missing) {
      const [message, view] = datagram(STATUS_KIND);
      view.setUint32(TOKEN_LENGTH + 1, used);
      view.setUint32(TOKEN_LENGTH + 5, missing);
      writer?.write(message).catch(() => {});
    },
    // Where the pointer goes: the count of this move, then x and y.
    move(count, x, y) {
      const [message, view] = datagram(MOVE_KIND);
      view.setUint32(TOKEN_LENGTH + 1, count);
      view.setUint16(TOKEN_LENGTH + 5, x);
      view.setUint16(TOKEN_LENGTH + 7, y);
      writer?.write(message).catch(() => {});
    },
    close() {
      closed = true;
      clearTimeout(timer);
      try { transport?.close(); } catch {}
    },
  };
}

// ---- Sound ----

// Sound arrives as 20 ms Opus packets, each in a message of its own. It is
// scheduled CUSHION seconds ahead to ride out uneven arrival; packets that would play more than MAX_AHEAD seconds
// from now are dropped, so the sound cannot fall behind the picture after a stall.
const CUSHION = 0.05, MAX_AHEAD = 0.15, PACKET_MICROS = 20000;
let speaker, playAt = 0;

// Decodes and plays sound packets; null when sound is switched off or the browser cannot decode it.
function soundPlayer() {
  if (settings.sound.value !== 'on' || !window.AudioDecoder) return null;
  // Browsers only let a page play sound once the user has acted on it; connecting is such an act.
  speaker ??= new AudioContext({ sampleRate: SOUND_RATE, latencyHint: 'interactive' });
  speaker.resume();
  let packets = 0;
  const decoder = new AudioDecoder({
    output(data) {
      const buffer = speaker.createBuffer(data.numberOfChannels, data.numberOfFrames, data.sampleRate);
      for (let channel = 0; channel < data.numberOfChannels; channel++) {
        data.copyTo(buffer.getChannelData(channel), { planeIndex: channel, format: 'f32-planar' });
      }
      data.close();
      if (playAt > speaker.currentTime + MAX_AHEAD) return;
      if (playAt < speaker.currentTime) playAt = speaker.currentTime + CUSHION;  // the first packet, or after a pause
      const source = speaker.createBufferSource();
      source.buffer = buffer;
      source.connect(speaker.destination);
      source.start(playAt);
      playAt += buffer.duration;
    },
    error() {},
  });
  decoder.configure({ codec: 'opus', sampleRate: SOUND_RATE, numberOfChannels: SOUND_CHANNELS });
  return {
    play: packet => decoder.state === 'configured' && decoder.decode(new EncodedAudioChunk({ type: 'key', timestamp: packets++ * PACKET_MICROS, data: packet })),
    close: () => decoder.state !== 'closed' && decoder.close(),
  };
}

// ---- Pill and panel ----

// The pill slides in while the pointer is at the middle of the bottom edge (or on the pill itself), and for
// PEEK ms after connecting so that it is known to be there.
const EDGE = 16, PEEK = 3000;
let atEdge = false, peeking = 0;
const showPill = () => document.body.classList.toggle('pill-shown', atEdge || !!peeking);
addEventListener('pointermove', event => {
  if (event.buttons) return;  // a drag in the remote picture is not a request for the pill
  const box = $('pill').getBoundingClientRect();  // below the window while hidden
  atEdge = event.clientX > box.left - EDGE && event.clientX < box.right + EDGE && event.clientY > Math.min(box.top, innerHeight) - EDGE;
  showPill();
});
document.documentElement.addEventListener('pointerleave', () => showPill(atEdge = false));

function showPanel(open) {
  settings.hidden = !open;
  document.body.classList.toggle('panel-open', open);
}

function setConnected(on, problem = '') {
  document.body.classList.toggle('connected', on);
  if (on) {
    clearTimeout(peeking);
    peeking = setTimeout(() => showPill(peeking = 0), PEEK);
    showPill();
  } else {
    document.body.classList.remove('slow', 'waiting');
    showPanel(false);
  }
  const choices = ['bitrate', 'fps'].map(name => settings[name].selectedOptions[0].textContent);
  $('summary').textContent = problem || choices.join(' / ');
  $('summary').classList.toggle('problem', !!problem);
}

// Refreshes the pill and the panel: `frames` drawn in the last second, where the delay went (`parts`, in ms),
// the video's bitrate as `received` of what the host `allowed`, in kbit/s, and whether the link is what holds
// it there. Below SLOW_RATE that shows in the picture, and is said.
const SLOW_RATE = 3000;
let colourDetail = 'full';  // as the stream's latest decoder configuration says
function showStatistics(frames, parts, received, allowed, heldBack, way) {
  const delay = Math.round(Object.values(parts).reduce((sum, part) => sum + part));
  const slow = heldBack && allowed < SLOW_RATE;
  const megabits = kbps => (kbps / 1000).toFixed(1);
  document.body.classList.toggle('slow', slow);
  // The three numbers stand in the panel and, where they are pinned, in a corner of the picture.
  $('now-fps').textContent = $('pin-fps').textContent = `${frames} fps`;
  $('now-delay').textContent = $('pin-delay').textContent = `${delay} ms`;
  $('now-bitrate').textContent = $('pin-bitrate').textContent = `${megabits(received)} Mbit/s`;
  $('now-picture').textContent =
    `${canvas.width} × ${canvas.height}, ${colourDetail} colour detail, ${way}, up to ${megabits(allowed)} Mbit/s`;
  $('notice').textContent = `This connection carries about ${megabits(allowed)} Mbit/s. Moving pictures are softened so the session stays responsive.`;
  $('pill-text').textContent = slow ? `Slow link / ${megabits(allowed)} Mbit/s` : `${frames} fps / ${delay} ms / ${way}`;
  for (const [name, value] of Object.entries(parts)) {
    settings.querySelector(`.bar .${name}`).style.setProperty('--weight', Math.max(value, 0.5));
    settings.querySelector(`output.${name}`).textContent = value.toFixed(value < 10 ? 1 : 0);
  }
}

// ---- Clipboard ----

// Clipboard text is kept the same on both sides: the local one is offered whenever this window gains focus
// (the browser asks for permission once), and text copied remotely is written to the local clipboard.
let clipboard = '';
async function offerClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    const length = new TextEncoder().encode(JSON.stringify(['clipboard', text])).length;
    if (!text || text === clipboard || length > LONGEST_MESSAGE) return;
    clipboard = text;
    send('clipboard', text);
  } catch {}  // not permitted, or the window is not focused
}
addEventListener('focus', () => connected() && offerClipboard());

// ---- Session ----

// A session that ends without being asked to is taken up again, a try a second for RETRY ms: the host may
// have restarted, or have handed over between the login screen and the desktop behind it.
const RETRY = 30000, RECONNECT = 1000;  // ms to keep trying after a session ended unasked for, and between tries
let retryUntil = 0, leaving = false;

const TICK = 250;  // ms between looks at the stream
const TICKS_PER_REPORT = 1000 / TICK;  // the host reports once a second, and what arrived is averaged over that
const PING = 100;  // ms between pings
const STATUS = 50;  // ms between words to the host on how video over UDP fares

// The remote pointer's shape, which the pointer over the picture takes on where the host tells it: 16-bit width,
// height and place of its tip, then rows of red, green, blue and alpha. It is drawn as large as the picture's
// pixels are shown here. Browsers take no pointer larger than BIGGEST CSS pixels; the arrow stands in then.
const BIGGEST = 128;
let shape = null;
function showPointer() {
  const scale = canvas.getBoundingClientRect().width / canvas.width, sharpness = devicePixelRatio;
  const fits = shape && Math.max(shape.width, shape.height) * scale <= BIGGEST;
  if (!fits) return canvas.style.removeProperty('--pointer');
  const drawn = new OffscreenCanvas(shape.width, shape.height), sized = document.createElement('canvas');
  drawn.getContext('2d').putImageData(shape.image, 0, 0);
  sized.width = Math.max(1, Math.round(shape.width * scale * sharpness));
  sized.height = Math.max(1, Math.round(shape.height * scale * sharpness));
  sized.getContext('2d').drawImage(drawn, 0, 0, sized.width, sized.height);
  const tip = [shape.x, shape.y].map(place => Math.round(place * scale));
  canvas.style.setProperty('--pointer', `image-set(url(${sized.toDataURL()}) ${sharpness}x) ${tip.join(' ')}, default`);
}
addEventListener('resize', showPointer);

// With the size set to the client, the host makes its screen to this window: its size in CSS pixels and how
// many device pixels each has. It is told at login, and again once a resize has settled.
const WINDOW_SETTLE = 300;
const windowSize = () => [innerWidth, innerHeight, devicePixelRatio];
let resizing;
addEventListener('resize', () => {
  clearTimeout(resizing);
  if (settings.size.value === 'client') resizing = setTimeout(() => send('window', windowSize()), WINDOW_SETTLE);
});

// Opens a session with the current settings, replacing any existing one.
function connect() {
  stop?.();
  leaving = false;
  document.body.classList.toggle('remote-cursor', settings.cursor.value === 'yes');
  const ws = socket = new WebSocket('/ws');
  const video = videoPlayer(() => ws.close()), sound = soundPlayer();
  let live = false;  // whether the stream has begun, which is what shows that the login was accepted
  let bytes = 0, received = 0, roundTrip = 0, ticks = 0;  // `received` counts all that arrived
  let host = { encode: 0, send: 0, kbps: 0, heldBack: false };  // what the host reports once a second
  // Video comes over the WebSocket until the host is reached over UDP, and from then on as datagrams. When it
  // changes its way it begins anew, with a piece that says how to decode: `awaited` while that is still to
  // come on the WebSocket.
  let byUdp = false, awaited = false;
  const joiner = pieceJoiner(piece => { byUdp = true; show(piece); }, () => path?.say(...joiner.status()));
  // A hidden page is let run so seldom that its word would be stale: it says nothing, and the host goes back
  // to the WebSocket until it is seen again.
  const status = setInterval(() => document.hidden || path?.say(...joiner.status()), STATUS);
  // Sound over UDP: a datagram is 8, the packet's number (4 bytes), its length (2), the packet, and the packet
  // before it once more, which is played first where its own datagram got lost.
  let heard = -1;
  function hear(datagram) {
    const view = new DataView(datagram.buffer, datagram.byteOffset), number = view.getUint32(1), length = view.getUint16(5);
    if (number <= heard) return;  // came late
    if (number > heard + 1 && datagram.length > 7 + length) sound?.play(datagram.subarray(7 + length));
    heard = number;
    sound?.play(datagram.subarray(7, 7 + length));
  }
  function show(piece) {
    if (!live) {
      live = true;
      retryUntil = 0;
      document.body.classList.remove('waiting');
      setConnected(true);
      // Kept in this browser so the next visit only needs a click. Anyone using this browser profile can read it.
      try { localStorage.password = login.password.value; } catch {}
      offerClipboard();
    }
    video.feed(piece);
  }
  const recent = [];  // bytes of video received during each of the last four checks

  // The host sends each ping back ahead of any waiting video, so the time it took is close to the network's
  // round trip. A ping also tells the host the last round trip and how much has arrived, which it sets the
  // bitrate by; a hidden page is served late and says neither.
  const ping = setInterval(() => {
    send('ping', performance.now(), ...(document.hidden ? [0, 0] : [Math.round(roundTrip), received]));
  }, PING);
  const report = setInterval(() => {
    recent.push(bytes);
    bytes = 0;
    if (recent.length > TICKS_PER_REPORT) recent.shift();
    const received = recent.reduce((sum, count) => sum + count) * 8 / (TICK * recent.length);  // kbit/s
    if (++ticks % TICKS_PER_REPORT === 0 && live && host.kbps) {  // once the host has reported
      const { frames, decode } = video.measure();
      showStatistics(frames, { encode: host.encode, send: host.send, network: roundTrip / 2, decode }, received, host.kbps, host.heldBack, byUdp ? 'UDP' : 'TCP');
    }
  }, TICK);

  // What the host says in text messages, which are [kind, ...values], and what it sends besides video.
  const told = {
    ping(sent) { roundTrip = performance.now() - sent; },
    stats(encode, send, kbps, heldBack) { host = { encode, send, kbps, heldBack }; },
    clipboard(text) { navigator.clipboard.writeText(clipboard = text).catch(() => {}); },
    // The host's screens and the one it shows. The choice is only offered where there is one to make.
    screens(names, shown) {
      settings.screen.replaceChildren(...names.map(name => new Option(name)));
      settings.screen.value = shown;
      settings.screen.parentElement.hidden = names.length < 2;
    },
    // Where to reach the host's UDP side, and the token that says there which session this is.
    udp(port, fingerprint, token) {
      path?.close();
      path = datagramPath(port, fingerprint, token, datagram => {
        if (datagram[0] === SOUND) return hear(datagram);
        if (datagram[0] !== VIDEO) return;  // padding is only there to show the host what the link carries
        bytes += datagram.length;
        joiner.take(datagram);
      }, () => send('udp'));
    },
    // Video is back on the WebSocket ("tcp"); over UDP it would go on with piece `next`.
    path(next) { [byUdp, awaited] = [false, true]; joiner.restart(next); },
  };
  const carried = {
    [SOUND](data) { sound?.play(new Uint8Array(data, 1)); },
    [PADDING]() {},  // only there to show the host what the link carries
    [POINTER](data) {
      const view = new DataView(data), [width, height, x, y] = [1, 3, 5, 7].map(at => view.getUint16(at));
      shape = { width, height, x, y, image: new ImageData(new Uint8ClampedArray(data.slice(9)), width, height) };
      showPointer();
    },
  };
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => ws.send(JSON.stringify({
    password: login.password.value, window: windowSize(), ...Object.fromEntries(new FormData(settings)),
  }));
  ws.onmessage = event => {
    received += event.data.byteLength ?? event.data.length;
    if (typeof event.data === 'string') {
      const [kind, ...values] = JSON.parse(event.data);
      if (Object.hasOwn(told, kind)) told[kind](...values);
      return;
    }
    const kind = new Uint8Array(event.data, 0, 1)[0];
    if (Object.hasOwn(carried, kind)) return carried[kind](event.data);
    if (byUdp || awaited && !begins(new Uint8Array(event.data))) return;
    awaited = false;
    bytes += event.data.byteLength;
    show(event.data);
  };
  // Closing can take a while on a congested link, so a replaced session is silenced at once rather than in onclose.
  const end = stop = () => {
    clearInterval(ping);
    clearInterval(report);
    clearInterval(status);
    path?.close();
    path = null;
    joiner.close();
    showPointer(shape = null);
    ws.onmessage = null;
    ws.close();
    video.close();
    sound?.close();
  };
  ws.onclose = () => {
    end();
    if (ws !== socket) return;  // replaced by a newer session
    held.clear();
    if (live && !leaving) retryUntil = performance.now() + RETRY;
    if (!leaving && performance.now() < retryUntil) {
      $('pill-text').textContent = 'Reconnecting';
      document.body.classList.add('waiting');
      return setTimeout(() => ws === socket && !leaving && connect(), RECONNECT);
    }
    retryUntil = 0;
    if (!live) try { localStorage.removeItem('password'); } catch {}
    setConnected(false, live ? 'Disconnected' : 'Could not connect. Is the password right?');
    if (document.fullscreenElement) document.exitFullscreen();
  };
}

// ---- Keyboard and pointer ----

const BUTTONS = [0x110, 0x112, 0x111, 0x113, 0x114];  // DOM button index -> evdev BTN_*
const CONTROL = 29;
// KeyboardEvent.code -> evdev key code; the list is in evdev order starting at 1, "-" marks gaps.
const KEYS = { MetaLeft: 125, MetaRight: 126, ContextMenu: 127 };
('Escape Digit1 Digit2 Digit3 Digit4 Digit5 Digit6 Digit7 Digit8 Digit9 Digit0 Minus Equal Backspace Tab ' +
 'KeyQ KeyW KeyE KeyR KeyT KeyY KeyU KeyI KeyO KeyP BracketLeft BracketRight Enter ControlLeft ' +
 'KeyA KeyS KeyD KeyF KeyG KeyH KeyJ KeyK KeyL Semicolon Quote Backquote ShiftLeft Backslash ' +
 'KeyZ KeyX KeyC KeyV KeyB KeyN KeyM Comma Period Slash ShiftRight NumpadMultiply AltLeft Space CapsLock ' +
 'F1 F2 F3 F4 F5 F6 F7 F8 F9 F10 NumLock ScrollLock Numpad7 Numpad8 Numpad9 NumpadSubtract ' +
 'Numpad4 Numpad5 Numpad6 NumpadAdd Numpad1 Numpad2 Numpad3 Numpad0 NumpadDecimal - - IntlBackslash F11 F12 ' +
 '- - - - - - - NumpadEnter ControlRight NumpadDivide PrintScreen AltRight - ' +
 'Home ArrowUp PageUp ArrowLeft ArrowRight End ArrowDown PageDown Insert Delete'
).split(' ').forEach((code, i) => KEYS[code] = i + 1);

const held = new Set();  // keys and buttons that are down on the remote side
function key(code, down) {
  down ? held.add(code) : held.delete(code);
  send('key', code, +down);
}
const releaseAll = () => held.forEach(code => key(code, false));

function onKey(event) {
  const code = KEYS[event.code];
  if (!connected() || !code) return;
  event.preventDefault();
  if (event.repeat) return;  // the remote side generates its own repeats
  key(code, event.type === 'keydown');
  // macOS never reports keyup for keys released while Cmd is down, so let go of everything with it.
  if (event.type === 'keyup' && event.key === 'Meta') releaseAll();
}
addEventListener('keydown', onKey);
addEventListener('keyup', onKey);
addEventListener('blur', releaseAll);

// Raw updates are delivered as they happen; ordinary move events wait for the next animation frame.
canvas.addEventListener('onpointerrawupdate' in canvas ? 'pointerrawupdate' : 'pointermove', event => {
  // The picture is letterboxed inside the canvas element; map to its visible area, normalised to 0..65535.
  const scale = Math.min(canvas.clientWidth / canvas.width, canvas.clientHeight / canvas.height);
  const normalise = (position, client, size) =>
    Math.round(Math.min(1, Math.max(0, (position - (client - size * scale) / 2) / (size * scale))) * POINTER_RANGE);
  // A move goes over the WebSocket and, where there is one, over UDP as well, with its count: the host takes
  // whichever arrives first, so a lost packet on either way holds the pointer up on neither.
  const [x, y] = [normalise(event.clientX, canvas.clientWidth, canvas.width), normalise(event.clientY, canvas.clientHeight, canvas.height)];
  send('move', x, y, ++moves);
  path?.move(moves, x, y);
});
canvas.onmousedown = event => {
  showPanel(false);  // working in the remote picture again puts the panel away
  key(BUTTONS[event.button], true);
};
addEventListener('mouseup', event => held.has(BUTTONS[event.button]) && key(BUTTONS[event.button], false));
canvas.oncontextmenu = event => event.preventDefault();
canvas.addEventListener('wheel', event => {
  event.preventDefault();
  // A trackpad pinch arrives as a wheel event with ctrlKey set although Ctrl is not held; forward it as Ctrl+scroll.
  const pinch = event.ctrlKey && !held.has(CONTROL);
  const scale = pinch ? 10 : 1;
  if (pinch) send('key', CONTROL, 1);
  send('scroll', Math.round(event.deltaX * scale), Math.round(-event.deltaY * scale));
  if (pinch) send('key', CONTROL, 0);
}, { passive: false });

// ---- Controls and start-up ----

// Keyboard Lock, which sends system shortcuts to the remote side, only takes effect in full screen.
const enterFullscreen = () => document.documentElement.requestFullscreen().then(() => navigator.keyboard?.lock());

login.onsubmit = event => {
  event.preventDefault();
  if (login.fullscreen.checked) enterFullscreen();
  connect();
};
settings.onsubmit = event => event.preventDefault();
// What the choice between response and quality means, in words, and where the numbers are pinned.
function showChoices() {
  const chosen = settings.querySelector('[name=patience]:checked');
  $('patience-says').textContent = `${chosen.ariaLabel}: video may run ${chosen.value} ms behind.`;
  document.body.dataset.pin = settings.pin.value;
}
settings.onchange = event => {
  try { localStorage.settings = JSON.stringify(Object.fromEntries(SAVED.map(name => [name, settings[name].value]))); } catch {}
  const { name } = event.target;
  showChoices();
  if (name === 'bitrate' || name === 'patience') send(name, +settings[name].value);  // take effect in the running stream
  else if (name !== 'pin') connect();                                               // the others when the capture starts
};
$('pill').onclick = () => showPanel(settings.hidden);
$('leave').onclick = () => {
  leaving = true;
  socket.close();
  setConnected(false, 'Disconnected');  // also when no session is up, between tries
};
$('fullscreen').onclick = () => document.fullscreenElement ? document.exitFullscreen() : enterFullscreen();

try {
  const saved = JSON.parse(localStorage.settings);
  if (saved.screen) settings.screen.add(new Option(saved.screen));  // the host lists its screens once connected
  for (const name of SAVED) {
    if (name in saved) settings[name].value = saved[name];
    if (settings[name].selectedIndex < 0) settings[name].selectedIndex = 0;  // a saved choice that no longer exists
  }
} catch {}
if (!settings.patience.value) settings.patience.value = 100;
showChoices();
try { login.password.value = localStorage.password ?? ''; } catch {}
login.password.required = !document.documentElement.classList.contains('open');
$('host').textContent = location.hostname.replace(/\.local$/, '') || 'Remote Desktop';
setConnected(false);
</script>
