# Checks and tests every push and pull request, and builds the portable binaries.
# Pushing a tag such as v0.1.0 also publishes them as a release, with install.sh, which is what the install
# line in the README downloads: releases/latest/download/install.sh, which fetches remote-desktop-<architecture>
# (remote-desktop-aarch64-macos on a Mac). The Windows binary is remote-desktop-x86_64-windows.exe.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    needs: [macos, windows-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # to create the release for a tag
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
          components: clippy, rustfmt
      - name: Install nasm (x264's x86 assembly) and cargo-zigbuild (brings zig)
        run: |
          sudo apt-get update
          sudo apt-get install --yes nasm
          pip install cargo-zigbuild
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- --deny warnings
      - run: cargo test --release
      - name: Build for glibc 2.28 and newer
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.28 --target aarch64-unknown-linux-gnu.2.28
          mkdir dist
          for architecture in x86_64 aarch64; do
            cp target/$architecture-unknown-linux-gnu/release/remote-desktop dist/remote-desktop-$architecture
          done
          cp ../install.sh dist/
      - uses: actions/download-artifact@v4
        with:
          name: remote-desktop-macos
          path: native/dist/
      - uses: actions/download-artifact@v4
        with:
          name: remote-desktop-windows
          path: native/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: remote-desktop
          path: native/dist/
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # macOS on Apple Silicon. The linker signs the binary ad hoc, which is all macOS asks of a downloaded program
  # that carries no quarantine, as curl leaves it.
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --release --all-targets -- --deny warnings
      - run: cargo test --release
      - run: |
          cargo build --release
          mkdir dist
          cp target/release/remote-desktop dist/remote-desktop-aarch64-macos
      - uses: actions/upload-artifact@v4
        with:
          name: remote-desktop-macos
          path: native/dist/

  # Windows, built on Linux with mingw-w64 into one .exe that needs no runtime besides Windows' own. Its tests
  # are built here too and run on Windows itself.
  windows:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - name: Install nasm and mingw-w64 with POSIX threads (which nvenc.c uses)
        run: |
          sudo apt-get update
          sudo apt-get install --yes nasm gcc-mingw-w64-x86-64-posix
      - run: cargo clippy --release --all-targets --target x86_64-pc-windows-gnu -- --deny warnings
      - run: |
          cargo build --release --target x86_64-pc-windows-gnu
          mkdir dist windows-tests
          cp target/x86_64-pc-windows-gnu/release/remote-desktop.exe dist/remote-desktop-x86_64-windows.exe
          cargo test --release --target x86_64-pc-windows-gnu --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable' \
            | xargs -I{} cp {} windows-tests/
          ls windows-tests/*.exe # there is a test program to run
      - uses: actions/upload-artifact@v4
        with:
          name: remote-desktop-windows
          path: native/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-tests
          path: native/windows-tests/

  windows-tests:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-tests
      - run: Get-ChildItem *.exe | ForEach-Object { & $_.FullName; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
