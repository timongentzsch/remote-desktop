# Checks and tests every push and pull request, and builds the portable binaries.
# Pushing a tag such as v0.1.0 also publishes them as a release, with install.sh, which is what the install
# line in the README downloads: releases/latest/download/install.sh, which fetches remote-desktop-<architecture>.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # to create the release for a tag
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
          components: clippy, rustfmt
      - name: Install nasm (x264's x86 assembly) and cargo-zigbuild (brings zig)
        run: |
          sudo apt-get update
          sudo apt-get install --yes nasm
          pip install cargo-zigbuild
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- --deny warnings
      - run: cargo test --release
      - name: Build for glibc 2.28 and newer
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.28 --target aarch64-unknown-linux-gnu.2.28
          mkdir dist
          for architecture in x86_64 aarch64; do
            cp target/$architecture-unknown-linux-gnu/release/remote-desktop dist/remote-desktop-$architecture
          done
          cp ../install.sh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: remote-desktop
          path: native/dist/
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
